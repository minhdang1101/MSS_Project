# Local infrastructure (PostgreSQL, RabbitMQ, Eureka registry). Business services run from the IDE.
# Credentials come from .env (git-ignored) - copy .env.example first.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dlms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    # Runs 00-create-databases, 01-schema, 02-seed in order - only when the volume is empty
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dlms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  # Service registry. Services started from the IDE register at http://localhost:8761/eureka/;
  # services in containers use EUREKA_URL=http://eureka-server:8761/eureka/ and depends_on: eureka-server (healthy).
  eureka-server:
    build:
      context: ./backend
      dockerfile: infrastructure/eureka-server/Dockerfile
    image: dlms/eureka-server
    container_name: dlms-eureka
    ports:
      - "8761:8761"

volumes:
  postgres-data:
